name: macOS Build

on:
  push:
    branches: [main, master, release/*]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE: release

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Install Xcode Command Line Tools
        run: xcode-select --install || true

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build application
        run: |
          chmod +x build-desktop.sh
          ./build-desktop.sh

      - name: Create DMG installer
        run: |
          cd src-tauri/target/release/bundle/dmg
          ls -la
          # The DMG is already created by Tauri, just need to verify it exists
          if [ -f "*.dmg" ]; then
            echo "DMG bundle created successfully"
          else
            # Try to find the actual .dmg file
            find . -name "*.dmg" -type f
          fi

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: jsoneditor-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: jsoneditor-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
          retention-days: 7
          if-no-files-found: warn
