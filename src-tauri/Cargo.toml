[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# PROXY NOTU: kurumsal proxy "crypto" iceren crates.io URL'lerini engelliyor.
# crypto-common registry'den cozule-medigi icin kaynagi vendor/ altinda
# sabitlendi (versiyon gereksinimi ^0.1.2'yi karsiliyor). vendor/ git'e
# dahil degildir; kurulum icin README "Proxy notu"na bakin.
[patch.crates-io]
crypto-common = { path = "../vendor/crypto-common" }
